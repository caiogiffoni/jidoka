[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "bcrypt>=4.0",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.10.0",
    "email-validator>=2.2.0",
    "sqlmodel>=0.0.39",
]

[dependency-groups]
dev = [
    "bandit>=1.9.0",
    "httpx2>=0.1.0",
    "hypothesis>=6.148.0",
    "mutmut>=3.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "radon>=6.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "critical: highest-risk API-consumer scenarios",
    "standard: normal API-consumer scenarios",
    "edge: boundary and unusual API-consumer scenarios",
]

[tool.mutmut]
source_paths = ["main.py", "auth.py", "models.py"]
pytest_add_cli_args_test_selection = ["tests/"]
runner = "bash gauntlet/run_tests_for_mutmut.sh"
backup = false
debug = false
also_copy = ["blocked_usernames.py", "db.py"]
