services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jidoka
      POSTGRES_PASSWORD: jidoka
      POSTGRES_DB: jidoka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jidoka -d jidoka"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # dev override: auto-reload via bind mount; production image uses `fastapi run`
    command: ["fastapi", "dev", "main.py", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://jidoka:jidoka@db:5432/jidoka
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-for-local}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv

volumes:
  pgdata:
  backend-venv:
