name: LLM tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/llm-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/llm-tests.yml"

jobs:
  llm-tests:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: jidoka
          POSTGRES_PASSWORD: jidoka
          POSTGRES_DB: jidoka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jidoka -d jidoka"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run LLM tests
        run: uv run pytest tests/llm/ -v -m llm
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4o-mini' }}
