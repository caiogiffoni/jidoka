server {
    listen 80;
    server_name api.jidoka.caiogiffoni.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.jidoka.caiogiffoni.com.br;

    ssl_certificate /etc/letsencrypt/live/api.jidoka.caiogiffoni.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jidoka.caiogiffoni.com.br/privkey.pem;

    location / {
        resolver 127.0.0.11 valid=10s;
        set $backend "backend:8000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
